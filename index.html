<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Le Portail — Serveur Cobblemon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<script>
/* ==========================================================================
   RÉGLAGES — c'est le seul bloc à modifier.
   ========================================================================== */
const CONFIG = {
  // Nom affiché en haut de la page.
  NOM_SERVEUR: "Cobblemon Chill Coop",

  // Adresse du Worker Cloudflare (le bot), sans barre à la fin.
  // Exemple : "https://portail.tonpseudo.workers.dev"
  // Laisse vide pour essayer la page en mode démonstration, sans Discord.
  API_URL: "https://cagole.yuness-mabrouki.workers.dev",

  // ID de l'application Discord (Developer Portal > General Information).
  DISCORD_CLIENT_ID: "1569664167919489044",

  // Musique : nom d'un fichier audio déposé dans le dépôt, à côté de index.html.

</script>
<style>
  :root{
    --box: rgba(16, 28, 58, .92);
    --box-edge: #f4f6ff;
    --box-edge-2: #5d7bd0;
    --ink: #ffffff;
    --shade: #0a1226;
    --yellow: #ffe45c;
    --cyan: #6fe8ff;
    --green: #8df07a;
    --commun: #c8d2e4; --rare: #6fb8ff; --legend: #ffd24a; --shiny: #ff9cf0;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    background:#101a3c; color:var(--ink);
    font-family:"Pixelify Sans", "Courier New", monospace;
    font-size:20px; line-height:1.35; overflow:hidden;
    -webkit-font-smoothing:none; text-shadow:2px 2px 0 var(--shade);
  }
  canvas{image-rendering:pixelated; image-rendering:crisp-edges}
  #bg{position:fixed; inset:0; width:100%; height:100%; object-fit:cover}
  #voile{position:fixed; inset:0; background:rgba(8,12,32,0); transition:background .6s; pointer-events:none}
  body.sombre #voile{background:rgba(8,12,32,.55)}
  #stage{position:fixed; inset:0; display:flex; flex-direction:column; padding:14px; gap:12px; max-width:1020px; margin:0 auto}
  header{display:flex; justify-content:space-between; align-items:center; gap:12px}
  header .name{font-weight:700; letter-spacing:.06em; text-transform:uppercase; font-size:16px}
  header .droite{display:flex; gap:8px; align-items:center}
  #qui{font-size:15px; display:none; align-items:center; gap:8px}
  #qui img{width:26px; height:26px; border-radius:6px; border:2px solid var(--box-edge); image-rendering:auto}
  .iconbtn{
    font:inherit; font-size:15px; color:var(--ink); text-shadow:inherit; cursor:pointer;
    background:var(--box); border:3px solid var(--box-edge); border-radius:10px; padding:4px 12px; white-space:nowrap;
  }
  :focus-visible{outline:3px solid var(--yellow); outline-offset:2px}

  .box{
    background:var(--box); border:4px solid var(--box-edge); border-radius:14px;
    box-shadow:0 0 0 3px var(--box-edge-2), 0 6px 0 3px rgba(0,0,0,.28);
  }
  #panel{flex:1; min-height:0; display:flex; overflow:auto; padding:4px}
  #panel > *{margin:auto}
  #panel:empty{visibility:hidden}

  #bottom{display:flex; flex-direction:column; align-items:flex-end; gap:10px}
  #choices{padding:10px 14px; min-width:min(100%, 300px); max-width:100%; display:none}
  #choices.on{display:block}
  .opt{
    display:block; width:100%; text-align:left; font:inherit; color:var(--ink); text-shadow:inherit;
    background:none; border:0; padding:5px 6px 5px 30px; position:relative; cursor:pointer; border-radius:6px;
  }
  .opt.sel{color:var(--yellow)}
  .opt.sel::before{content:"▶"; position:absolute; left:6px; top:5px; font-size:.8em; animation:nudge .6s steps(2) infinite}
  @keyframes nudge{50%{transform:translateX(3px)}}
  .saisie{display:flex; gap:8px}
  .saisie input{flex:1; min-width:0; font:inherit; color:var(--ink); background:rgba(0,0,0,.35); border:3px solid var(--box-edge-2); border-radius:8px; padding:6px 10px}

  #dialog{width:100%; min-height:124px; padding:16px 20px 22px; position:relative; cursor:pointer}
  #text{min-height:3.9em; white-space:pre-wrap}
  #more{position:absolute; right:18px; bottom:6px; color:var(--yellow); display:none; animation:bob .7s steps(2) infinite}
  #more.on{display:block}
  @keyframes bob{50%{transform:translateY(4px)}}
  .y{color:var(--yellow)} .c{color:var(--cyan)} .g{color:var(--green)}

  /* Écran titre : le titre est posé dans le ciel, au-dessus de l'arche */
  .title{text-align:center; margin-top:2vh !important}
  .title h1{font-size:clamp(40px, 9vw, 84px); margin:0; line-height:.95; letter-spacing:.08em; text-shadow:4px 4px 0 var(--shade), 0 0 28px rgba(111,232,255,.55)}
  .title p{margin:.5em 0 0; font-size:18px; color:var(--cyan); letter-spacing:.2em; text-transform:uppercase}

  /* Cartes illustrées */
  .cards{display:flex; flex-wrap:wrap; gap:16px; justify-content:center}
  .card{width:236px; overflow:hidden; text-align:center; padding-bottom:12px}
  .art{position:relative; height:128px; border-bottom:4px solid var(--box-edge); background:#0a0c1c}
  .art .sc{width:100%; height:100%; display:block}
  .art .bl{position:absolute; left:10px; bottom:-18px; width:40px; height:48px; filter:drop-shadow(2px 3px 0 rgba(0,0,0,.45))}
  .art .tag{position:absolute; right:8px; top:8px; font-size:13px; text-transform:uppercase; letter-spacing:.1em; padding:1px 8px; border-radius:6px; background:rgba(10,18,38,.8); border:2px solid currentColor}
  .card .nm{font-size:24px; font-weight:700; margin:14px 6px 0 56px; line-height:1.05; text-align:left; overflow-wrap:anywhere}
  .card .sub{font-size:15px; margin:6px 8px 0 56px; text-align:left; color:var(--cyan)}
  .card.hidden .art .sc{filter:brightness(.35) saturate(.4)}
  .card.hidden .bl{visibility:hidden}
  .card.hidden .nm, .card.hidden .sub{margin-left:8px; text-align:center}
  .pop{animation:pop .4s steps(5)}
  @keyframes pop{0%{transform:scale(.6) rotate(-3deg)}70%{transform:scale(1.08)}100%{transform:scale(1)}}

  /* Grille de choix manuel */
  .grid{padding:12px; display:grid; grid-template-columns:auto repeat(3, minmax(0,1fr)); gap:6px 8px; align-items:center; font-size:17px}
  .grid .gen{color:var(--cyan); font-size:14px; white-space:nowrap; padding-right:4px}
  .cell{font:inherit; color:var(--ink); text-shadow:inherit; cursor:pointer; padding:5px 8px; border-radius:8px; border:0; border-left:6px solid var(--el); background:rgba(255,255,255,.08); text-align:left; min-width:0; overflow:hidden}
  .cell:hover{background:rgba(255,228,92,.25)}

  /* Carte de dresseur */
  .dresseur{width:min(100%, 640px); overflow:hidden}
  .bandeau{position:relative; height:120px; border-bottom:4px solid var(--box-edge)}
  .bandeau canvas{width:100%; height:100%; display:block}
  .bandeau::after{content:""; position:absolute; inset:0; background:linear-gradient(to top, rgba(8,12,32,.78), rgba(8,12,32,0) 70%)}
  .bandeau .id{z-index:1}
  .bandeau .id{position:absolute; left:16px; bottom:10px; display:flex; align-items:flex-end; gap:12px}
  .bandeau img{width:64px; height:64px; border-radius:10px; border:4px solid var(--box-edge); image-rendering:auto; background:#223}
  .bandeau h2{margin:0; font-size:30px; line-height:1; text-shadow:3px 3px 0 var(--shade)}
  .bandeau small{font-size:15px; color:var(--cyan)}
  .dresseur .corps{padding:12px 16px 14px}
  .ligne{display:flex; justify-content:space-between; gap:12px; font-size:17px; padding:3px 0}
  .ligne span:first-child{color:var(--cyan)}
  .minis{display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:10px; margin-top:10px}
  .mini{border:3px solid var(--box-edge-2); border-radius:10px; overflow:hidden; text-align:center; background:rgba(0,0,0,.25)}
  .mini canvas{width:100%; height:56px; display:block}
  .mini b{display:block; font-size:17px; padding:2px 4px 0; overflow-wrap:anywhere}
  .mini i{display:block; font-style:normal; font-size:12px; text-transform:uppercase; letter-spacing:.08em; padding-bottom:4px}
  .mini.ok{border-color:var(--green)}

  /* Tableau de chasse */
  .tableau{width:min(100%, 760px); padding:14px 16px}
  .tableau h2{margin:0 0 8px; font-size:24px}
  .rang{display:grid; grid-template-columns:1.2fr repeat(3, 1fr); gap:8px; padding:7px 0; border-top:2px solid rgba(255,255,255,.14); font-size:16px; align-items:center}
  .rang .pj b{display:block} .rang .pj small{color:var(--cyan); font-size:13px}
  .pastille{display:inline-block; width:10px; height:10px; border-radius:3px; margin-right:5px; border:2px solid var(--box-edge)}

  /* Cinq cartes de cibles côte à côte */
  .cards{position:relative}
  .cards.c5{gap:12px}
  .cards.c5 .card{width:186px}
  .cards.c5 .art{height:104px}
  .cards.c5 .card .nm{font-size:20px; margin-left:52px}
  .cards.c5 .card .sub{font-size:13px; margin-left:52px}
  .card.tourne{animation:secoue .12s steps(2) infinite}
  .card.tourne .nm{color:var(--yellow)}
  @keyframes secoue{50%{transform:translateY(-3px) rotate(.6deg)}}
  /* Halo tournant derrière le starter */
  .halo{position:absolute; left:50%; top:50%; width:420px; height:420px; margin:-210px 0 0 -210px; border-radius:50%; pointer-events:none;
    background:repeating-conic-gradient(rgba(255,228,92,.22) 0 12deg, transparent 12deg 30deg); -webkit-mask:radial-gradient(closest-side, #000 30%, transparent 100%); mask:radial-gradient(closest-side, #000 30%, transparent 100%); animation:tourne 14s linear infinite}
  @keyframes tourne{to{transform:rotate(360deg)}}
  .cards .card{position:relative}
  /* Arrivée de chaque écran */
  #panel > *{animation:entre .35s steps(7)}
  @keyframes entre{from{opacity:0; transform:translateY(14px)}}
  /* Étincelles et confettis */
  .etin{position:fixed; width:6px; height:6px; z-index:50; pointer-events:none; animation:jaillit .75s steps(9) forwards}
  @keyframes jaillit{to{transform:translate(var(--dx),var(--dy)) scale(.2); opacity:0}}
  .conf{position:fixed; top:-12px; width:8px; height:8px; z-index:50; pointer-events:none; animation:tombe linear forwards}
  @keyframes tombe{to{transform:translate(var(--dx),105vh) rotate(540deg)}}
  /* Avancement du questionnaire */
  .pips{display:flex; gap:8px; flex-wrap:wrap; justify-content:center; margin-top:auto !important; margin-bottom:6px !important}
  .pips span{width:18px; height:18px; border:3px solid var(--box-edge); border-radius:5px; background:rgba(16,28,58,.7)}
  .pips .fait{background:var(--cyan)}
  .pips .ici{background:var(--yellow); animation:bob .7s steps(2) infinite}
  /* Profil et radar */
  .radar{image-rendering:auto; width:250px; height:210px; flex:none}
  .profil{display:flex; align-items:center; gap:10px; padding:10px 22px 10px 10px}
  .profil h2{margin:4px 0 0; font-size:30px; line-height:1.05; color:var(--yellow)}
  .deuxcol{display:flex; gap:14px; align-items:center}
  .deuxcol > div{flex:1; min-width:0}
  .defis{margin-top:8px; font-size:16px; display:grid; gap:4px}
  .defis div{display:flex; gap:8px; align-items:baseline}
  .defis span{color:var(--yellow); flex:none}
  .defis .fait{color:var(--green)}
  .minis{grid-template-columns:repeat(4, minmax(0,1fr))}
  /* Cible chromatique : des éclats qui scintillent sur l'illustration */
  .card.shiny .art::after, .mini.shiny::after{content:""; position:absolute; inset:0; pointer-events:none;
    background:radial-gradient(circle, #fff 0 1.5px, transparent 2px) 12% 30%/46px 40px, radial-gradient(circle, #ffd6fa 0 2px, transparent 2.5px) 70% 60%/58px 52px, radial-gradient(circle, #fff 0 1px, transparent 1.5px) 40% 80%/34px 30px;
    animation:scintille 1.1s steps(3) infinite}
  .mini{position:relative}
  .card.shiny .nm{color:var(--shiny)}
  @keyframes scintille{50%{opacity:.25; background-position:16% 36%, 66% 54%, 44% 74%}}
  .mini b{font-size:15px}
  .puces{display:flex; flex-wrap:wrap; gap:4px 12px; font-size:15px}
  .puces .ok{color:var(--green)}
  .rang{display:block}
  .rang .pj{margin-bottom:3px}
  .dresseur{width:min(100%, 760px)}
  /* Bilan du psychiatre : bandeau aux couleurs de l'archétype */
  .bilan{width:min(100%, 700px); overflow:hidden}
  .bilan .tete{display:flex; align-items:center; gap:14px; padding:14px 18px; background:linear-gradient(120deg, var(--a1), var(--a2)); border-bottom:4px solid var(--box-edge)}
  .bilan .sym{width:63px; height:63px; flex:none; filter:drop-shadow(3px 3px 0 rgba(0,0,0,.35))}
  .bilan h2{margin:0; font-size:27px; line-height:1.05; text-shadow:3px 3px 0 rgba(0,0,0,.45)}
  .bilan .tete small{font-size:14px; letter-spacing:.14em; text-transform:uppercase; text-shadow:2px 2px 0 rgba(0,0,0,.45)}
  .bilan .corps{padding:10px 16px 12px}
  .jauge{height:10px; border:2px solid var(--box-edge); border-radius:4px; background:rgba(0,0,0,.35); margin-top:3px}
  .jauge i{display:block; height:100%; background:var(--cyan)}
  /* Lecteur de musique */
  #dock{position:fixed; left:14px; top:58px; z-index:40; padding:6px; display:none}
  #dock.on{display:block}
  #dock iframe{display:block; width:240px; height:200px; border:0; border-radius:8px}
  #dock small{display:block; font-size:12px; margin-top:4px; max-width:240px}

  @media (max-width:600px){
    .cards.c5 .card{width:150px} .cards.c5 .art{height:84px}
    .cards.c5 .card .nm, .cards.c5 .card .sub{margin-left:8px; text-align:center} .cards.c5 .card .nm{font-size:18px; margin-top:20px}
    .deuxcol{flex-direction:column} .minis{grid-template-columns:repeat(2, minmax(0,1fr))}
    .profil{flex-direction:column; padding:10px; text-align:center} .profil h2{font-size:24px}
    .bilan h2{font-size:21px} .bilan .sym{width:45px; height:45px}
    .halo{width:300px; height:300px; margin:-150px 0 0 -150px}
    #dock iframe, #dock small{width:200px; max-width:200px}
    header .name{font-size:12px; max-width:34%} .iconbtn{font-size:13px; padding:3px 7px} #qui{font-size:0} header .droite{gap:5px}
    body{font-size:17px} #stage{padding:10px}
    .card{width:158px} .art{height:96px} .card .nm{font-size:20px; margin-left:8px; margin-top:22px; text-align:center} .card .sub{margin-left:8px; text-align:center; font-size:13px}
    .grid{font-size:14px; gap:4px 5px; grid-template-columns:repeat(3, minmax(0,1fr)); padding:10px}
    .grid .gen{grid-column:1/-1; margin-top:4px}
    .cell{padding:5px 4px 5px 6px}
    .rang{grid-template-columns:1fr 1fr; font-size:14px} .rang .pj{grid-column:1/-1}
    .bandeau h2{font-size:24px}
  }
  @media (prefers-reduced-motion:reduce){ .opt.sel::before,#more,.pop,.halo,.card.tourne,#panel > *,.pips .ici,.card.shiny .art::after,.mini.shiny::after{animation:none} }
</style>
</head>
<body>
<canvas id="bg" width="320" height="180" aria-hidden="true"></canvas>
<div id="voile"></div>
<div id="dock" class="box"><div class="cadre"></div><small>La musique vient de YouTube. Ferme-la avec le bouton Musique.</small></div>
<div id="stage">
  <header>
    <span class="name" id="srv"></span>
    <span class="droite"><span id="qui"></span><button class="iconbtn" id="mus" aria-pressed="false">Musique : non</button><button class="iconbtn" id="snd" aria-pressed="true">Son : oui</button></span>
  </header>
  <div id="panel" aria-live="polite"></div>
  <div id="bottom">
    <div id="choices" class="box"></div>
    <div id="dialog" class="box" role="button" tabindex="0" aria-label="Continuer">
      <div id="text" aria-live="polite"></div>
      <span id="more">▼</span>
    </div>
  </div>
</div>

<script>
/* ==========================================================================
   DONNÉES
   ========================================================================== */
const TYPES = { normal:["Normal","#a8a878"], feu:["Feu","#f0703c"], eau:["Eau","#4a9cf0"], plante:["Plante","#58c060"], electrik:["Électrik","#f8d030"], glace:["Glace","#8fd8e8"], combat:["Combat","#c8483c"], poison:["Poison","#a858b0"], sol:["Sol","#d8b050"], vol:["Vol","#98a8f0"], psy:["Psy","#f85888"], insecte:["Insecte","#a8b820"], roche:["Roche","#b8a048"], spectre:["Spectre","#8068b0"], dragon:["Dragon","#8058f8"], tenebres:["Ténèbres","#8a7060"], acier:["Acier","#b8b8d0"], fee:["Fée","#ee99ac"] };
const HABITATS = { foret:"Forêt", prairie:"Prairie", grotte:"Grotte", ocean:"Océan", riviere:"Rivière", montagne:"Montagne", neige:"Toundra", desert:"Désert", volcan:"Volcan", ciel:"Haut ciel", ruines:"Ruines", cosmos:"Ailleurs" };
const DECOR_STARTER = { plante:"foret", feu:"volcan", eau:"riviere" };
const RARETES = [["commun","Commune","var(--commun)",1],["rare","Rare","var(--rare)",2],["legend","Légendaire","var(--legend)",3],["shiny","Chromatique","var(--shiny)",4]];
const TRAITS_NOMS = { BR:"Bravoure", CA:"Calme", JO:"Joie", MA:"Malice", FI:"Fierté", DO:"Douceur", RE:"Réserve", GO:"Gourmandise", EN:"Énergie" };
// Profil de caractère de chaque type (le bot fait le vrai calcul ; cette copie sert au mode démonstration).
const TYPES_PROFIL = { normal:{GO:2,DO:2,CA:1}, feu:{BR:3,EN:2}, eau:{CA:3,DO:1,JO:1}, plante:{CA:2,DO:2,GO:1}, electrik:{EN:3,JO:2}, glace:{RE:3,FI:1,CA:1}, combat:{BR:3,FI:1,EN:1}, poison:{MA:3,RE:1}, sol:{GO:2,CA:2,BR:1}, vol:{EN:2,BR:1,JO:1}, psy:{MA:2,RE:2,CA:1}, insecte:{MA:2,EN:2}, roche:{BR:2,CA:2,FI:1}, spectre:{RE:2,MA:2,JO:1}, dragon:{FI:3,BR:2}, tenebres:{MA:3,BR:1,FI:1}, acier:{FI:2,CA:2,RE:1}, fee:{DO:3,JO:2} };
const REGIONS = ["Kanto","Johto","Hoenn","Sinnoh","Unys","Kalos","Alola","Galar","Paldea"];

// Neuf traits de caractère mesurés par le quiz.
// BR bravoure · CA calme · JO joie · MA malice · FI fierté · DO douceur · RE réserve · GO gourmandise · EN énergie
// Chaque starter a SA nature, choisie d'après son caractère, et un profil de traits.
const S = (nom, el, gen, nature, profil, txt) => ({ nom, el, gen, nature, profil, txt });
const STARTERS = [
  S("Bulbizarre","plante",0,"Docile",   {CA:3,DO:2},      "Posé, fiable, facile à vivre. Tu avances à ton rythme et tout le monde aime t'avoir dans l'équipe."),
  S("Salamèche","feu",0,"Brave",        {BR:3,EN:1,FI:1}, "Tu fonces d'abord, tu réfléchis ensuite. Une flamme qui ne s'éteint pas, même sous la pluie."),
  S("Carapuce","eau",0,"Farceur",       {MA:3,JO:2},      "Toujours une blague d'avance et un plan un peu louche. Avec toi, on ne s'ennuie jamais."),
  S("Germignon","plante",1,"Doux",      {DO:3,JO:1,CA:1}, "Gentil sans effort. Tu apaises les tensions et tu remarques quand quelqu'un ne va pas bien."),
  S("Héricendre","feu",1,"Timide",      {RE:3,DO:1,BR:1}, "Discret au premier abord. Mais quand on te pousse à bout, le feu s'allume d'un coup."),
  S("Kaiminus","eau",1,"Jovial",        {JO:3,EN:2},      "Un rire qui s'entend de loin. Tu mords la vie à pleines dents, parfois un peu trop fort."),
  S("Arcko","plante",2,"Imperturbable", {RE:2,FI:2,CA:2}, "Sang-froid total. Tu observes depuis ta branche et tu ne te laisses impressionner par personne."),
  S("Poussifeu","feu",2,"Affectueux",   {DO:2,EN:2,BR:1}, "Tu suis tes amis partout et tu leur tiens chaud. Petit, mais prêt à tout pour eux."),
  S("Gobou","eau",2,"Décontracté",      {CA:2,JO:2,GO:1}, "Rien ne presse. Tu prends les choses comme elles viennent, et bizarrement ça marche toujours."),
  S("Tortipouss","plante",3,"Sérieux",  {CA:2,BR:2,FI:1}, "Les pieds sur terre. Tu fais les choses bien, dans l'ordre, et tu ne lâches pas en route."),
  S("Ouisticram","feu",3,"Espiègle",    {EN:3,MA:2},      "Impossible de te faire tenir en place. Tu grimpes partout et tu touches à tout."),
  S("Tiplouf","eau",3,"Fier",           {FI:3,BR:1},      "Tu as ta fierté et tu n'aimes pas qu'on t'aide. Tu tombes, tu te relèves, et tu fais comme si de rien n'était."),
  S("Vipélierre","plante",4,"Élégant",  {FI:3,CA:1,MA:1}, "Un regard, et tout est dit. Tu vises l'excellence et tu le fais avec style."),

/* ==========================================================================
   HASARD REPRODUCTIBLE (pour les décors et l'ordre des questions)
   ========================================================================== */
function graine(str){ let h=1779033703^str.length; for(let i=0;i<str.length;i++){h=Math.imul(h^str.charCodeAt(i),3432918353); h=h<<13|h>>>19;} return ()=>{h=Math.imul(h^(h>>>16),2246822507); h=Math.imul(h^(h>>>13),3266489909); return (h^=h>>>16)>>>0;}; }
function alea(seed){ let a=graine(String(seed))(); return ()=>{ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function melange(liste, seed){ const r=alea(seed), a=liste.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(r()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

function scene(cv, hab, seed){
  const P=HAB[hab]||HAB.prairie, x=cv.getContext("2d"), W=cv.width, H=cv.height, k=W/96, r=alea(hab+"|"+seed);
  const px=(c,X,Y,w=1,h=1)=>{ x.fillStyle=c; x.fillRect(Math.round(X),Math.round(Y),Math.max(1,Math.round(w)),Math.max(1,Math.round(h))); };
  const disque=(c,cx,cy,R)=>{ for(let dy=-R;dy<=R;dy++){ const d=Math.floor(Math.sqrt(R*R-dy*dy)); px(c,cx-d,cy+dy,2*d+1,1); } };
  const nuage=(cx,cy,w,c1="rgba(255,255,255,.9)",c2="rgba(255,255,255,.5)")=>{ px(c2,cx-w/2,cy,w,3*k); px(c1,cx-w/2+2*k,cy-2*k,w-5*k,3*k); px(c1,cx-w/4,cy-4*k,w/2.2,2*k); };
  const pin=(X,base,h,c)=>{ const et=h>22*k?4:h>12*k?3:1, he=h/et; for(let i=0;i<h;i++){ const e=Math.floor(i/he), l=1+Math.floor((i-e*he)*.5+e*he*.26)*2; px(c,X-(l>>1),base-h+i,l,1); } px(c,X-k/2,base,Math.max(1,k),2*k); };
  // ciel en bandes, avec un tramage d'une ligne entre deux teintes
  const n=P.ciel.length, bh=H/n;
  for(let i=0;i<n;i++){ px(P.ciel[i],0,Math.floor(i*bh),W,Math.ceil(bh)+1); }
  for(let i=1;i<n;i++){ const Y=Math.floor(i*bh); for(let X=0;X<W;X+=2){ px(P.ciel[i],X,Y-1); px(P.ciel[i-1],X+1,Y); } }
  for(let i=0;i<(P.etoiles||0);i++) px(r()>.3?"#ffffff":"#9fb0ff", r()*W, r()*H*.7);
  if(P.astre){ const [ax,ay,ar,ac]=P.astre; disque("rgba(255,255,255,.14)",ax*W,ay*H,Math.round(ar*k*1.7)); disque(ac,ax*W,ay*H,Math.round(ar*k)); }
  for(let i=0;i<(P.nuages||0);i++) nuage(r()*W, H*(.12+r()*.25), (18+r()*16)*k);
  // plans de relief
  const sommets=[];
  P.couches.forEach(([col,y,amp,f,cap])=>{
    const p1=r()*6.28, p2=r()*6.28, tops=[];
    for(let X=0;X<W;X++){ const t=Math.round(H*y + amp*k*(Math.sin(X*f/k+p1)*.6+Math.sin(X*f*2.7/k+p2)*.4)); tops.push(t); px(col,X,t,1,H-t); if(cap && t<H*y-amp*k*.2) px(cap,X,t,1,Math.max(1,(H*y-amp*k*.2-t)*.6)); }

  const D=P.deco;
  if(D==="pins"||D==="flocons"){ const nb=D==="pins"?7:4; for(let i=0;i<nb;i++){ const X=Math.floor(r()*W); pin(X, sol[X]+2*k, (9+r()*9)*k, D==="pins"?"rgba(4,14,12,.72)":"#3a5a7a"); } }
  if(D==="flocons") for(let i=0;i<34*k;i++) px("#ffffff", r()*W, r()*H);
  if(D==="fleurs"){ for(let i=0;i<22*k;i++){ const X=Math.floor(r()*W); px(["#ffffff","#ffe45c","#ff9cc0","#ffd0a0"][i%4], X, sol[X]+2+r()*(H-sol[X]-3)); } for(let i=0;i<10*k;i++){ const X=Math.floor(r()*W); px("#2a7a40",X,sol[X]-2*k,1,3*k); } }
  if(D==="cristaux"){ for(let i=0;i<9;i++){ const X=r()*W, h=(6+r()*16)*k; for(let j=0;j<h;j++) px("#0a0818", X-(h-j)/5, j, (h-j)/2.5+1, 1); }
    for(let i=0;i<6;i++){ const X=Math.floor(r()*W), h=Math.round((4+r()*6)*k), b=sol[X]+2*k; disque("rgba(111,232,255,.16)",X,b-h/2,h); for(let j=0;j<h;j++){ const l=Math.max(1,Math.round((1-Math.abs(j-h*.35)/(h*.7))*3*k)); px(j<h*.35?"#d8fbff":"#6fe8ff", X-(l>>1), b-h+j, l, 1); } } }
  if(D==="vagues"){ const y0=Math.round(H*.56), mer=["#3f86c8","#2a6fb0","#1f5a9a","#174a84","#103a6c"]; mer.forEach((c,i)=>px(c,0,y0+i*(H-y0)/mer.length,W,(H-y0)/mer.length+1));
    for(let i=0;i<40*k;i++){ const Y=y0+r()*(H-y0), t=(Y-y0)/(H-y0); px("rgba(255,255,255,.55)", r()*W, Y, (2+t*7)*k, 1); }
    for(let Y=y0;Y<H;Y+=2){ const t=(Y-y0)/(H-y0); px("#fff3c0", W*.5-(2+t*9)*k+ (r()-.5)*4*k, Y, (4+t*16)*k*(.4+r()*.6), 1); } }
  if(D==="riviere"){ const y0=Math.round(H*.6); for(let Y=y0;Y<H;Y++){ const t=(Y-y0)/(H-y0), cx=W*.5+Math.sin(t*4.2+1)*W*.16*(1-t*.4), l=(2+t*26)*k; px("#4aa8e8",cx-l/2,Y,l,1); px("#9fdcff",cx-l/2,Y,Math.max(1,l*.14),1); if(r()>.72) px("#ffffff",cx-l/2+r()*l,Y,2*k,1); }
    for(let i=0;i<5;i++){ const X=Math.floor(r()*W); pin(X, sol[X]+2*k, (7+r()*6)*k, "rgba(6,30,18,.7)"); } }
  if(D==="dunes"){ for(let i=0;i<26*k;i++){ const X=Math.floor(r()*W); px("rgba(255,240,200,.5)", X, sol[X]+1+r()*(H-sol[X]-2), (3+r()*6)*k, 1); } }
  if(D==="lave"){ const c0=sommets[0]; let xm=0; c0.forEach((t,i)=>{ if(t<c0[xm]) xm=i; }); const ym=c0[xm];
    disque("rgba(255,120,40,.22)",xm,ym,Math.round(15*k)); disque("rgba(255,200,80,.3)",xm,ym,Math.round(7*k)); px("#ffd060",xm-3*k,ym,6*k,2*k);
    let X=xm; for(let Y=ym+2*k;Y<H*.72;Y++){ X+=Math.round((r()-.5)*2.2); px("#ff8a30",X,Y,2*k,1); px("#ffd060",X,Y,1,1); }
    for(let i=0;i<26*k;i++) px(r()>.5?"#ffb040":"#ff6020", xm+(r()-.5)*50*k, ym-r()*34*k); }

  if(D==="colonnes"){ for(let i=0;i<5;i++){ const X=Math.floor((.1+i*.2+ (r()-.5)*.08)*W), h=Math.round((10+r()*20)*k), b=sol[Math.min(W-1,X)]+3*k, l=Math.round(4*k);
      px("#c8d0ee",X,b-h,l,h); px("#8a94c0",X+l-Math.max(1,k),b-h,Math.max(1,k),h); px("#e8ecff",X-k,b-h,l+2*k,2*k); px("#9aa4d0",X-k,b-2*k,l+2*k,2*k); if(r()>.5) px(P.ciel[2],X,b-h,l*.6,3*k); } }
  if(D==="nebuleuse"){ for(let i=0;i<7;i++) disque(["rgba(255,90,200,.12)","rgba(111,232,255,.1)","rgba(160,110,255,.14)"][i%3], r()*W, r()*H, Math.round((10+r()*16)*k));
    const cx=W*.68, cy=H*.42, R=Math.round(11*k); disque("#f0a060",cx,cy,R); disque("#f8c888",cx-2*k,cy-2*k,Math.round(R*.55)); px("#ffe8c0",cx-R*1.7,cy,R*3.4,Math.max(1,k)); px("#f0a060",cx-R*.8,cy-k,R*1.6,Math.max(1,k)); }
  if(D==="arche"){
    const cx=Math.round(W*.5), base=sol[cx]+2*k, larg=Math.round(H*.15), haut=Math.round(H*.36);
    // chemin qui mène l'œil du bas de l'image vers l'arche

    const pil=Math.max(2,Math.round(H*.035)); px("#8a86b8",cx-larg/2-pil,base-haut*.78,pil,haut*.78); px("#8a86b8",cx+larg/2,base-haut*.78,pil,haut*.78);

// Blason : un écu à la couleur du type, avec un chevron et 1 à 3 gemmes selon la rareté.
function blason(cv, type, rang){
  const x=cv.getContext("2d"), col=(TYPES[type]||TYPES.normal)[1]; x.clearRect(0,0,20,24);
  const larg=Y=>Y<13?18:Math.max(2,18-(Y-12)*1.7);
  for(let Y=0;Y<24;Y++){ const l=Math.round(larg(Y)), X=Math.round(10-l/2); x.fillStyle="#0a1226"; x.fillRect(X-1,Y,l+2,1); }
  for(let Y=1;Y<23;Y++){ const l=Math.round(larg(Y))-2, X=Math.round(10-l/2); if(l<1) continue; x.fillStyle=col; x.fillRect(X,Y,l,1); x.fillStyle="rgba(255,255,255,.38)"; x.fillRect(X,Y,Math.max(1,Math.round(l*.22)),1); x.fillStyle="rgba(0,0,0,.22)"; x.fillRect(X+l-Math.max(1,Math.round(l*.2)),Y,Math.max(1,Math.round(l*.2)),1); }
  x.fillStyle="rgba(255,255,255,.85)"; for(let i=0;i<7;i++){ x.fillRect(3+i,13-Math.min(i,6-i)+3,1,2); x.fillRect(10+i,10+Math.min(i,6-i)+0,1,2); }
  x.fillStyle="#f4f6ff"; x.fillRect(2,1,16,1);
  const g=rang>3?2:3, pas=g+1, gx=10-(rang*pas-1)/2; for(let i=0;i<rang;i++){ const X=Math.round(gx+i*pas); x.fillStyle="#0a1226"; x.fillRect(X-1,4,g+2,g+2); x.fillStyle="#ffe45c"; x.fillRect(X,5,g,g); x.fillStyle="#fff8c8"; x.fillRect(X,5,1,1); }
}

// Radar des neuf traits : la forme grandit depuis le centre, les deux traits dominants sont en jaune.
function radar(cv, traits){
  const x=cv.getContext("2d"), W=cv.width, H=cv.height, cx=W/2, cy=H/2+2, R=Math.min(W,H)/2-40, cles=Object.keys(TRAITS_NOMS);
  const max=Math.max(.01,...cles.map(k=>traits[k]||0)), forts=cles.slice().sort((a,b)=>(traits[b]||0)-(traits[a]||0)).slice(0,2);
  const pt=(i,r)=>{ const a=-Math.PI/2+i*2*Math.PI/cles.length; return [cx+Math.cos(a)*r, cy+Math.sin(a)*r]; };
  const fixe=matchMedia("(prefers-reduced-motion:reduce)").matches, t0=performance.now();
  (function trace(now){
    const g=fixe?1:Math.min(1,(now-t0)/800), e=1-Math.pow(1-g,3);
    x.clearRect(0,0,W,H);
    for(let n=1;n<=3;n++){ x.beginPath(); cles.forEach((k,i)=>{ const [X,Y]=pt(i,R*n/3); i?x.lineTo(X,Y):x.moveTo(X,Y); }); x.closePath(); x.strokeStyle="rgba(255,255,255,.22)"; x.lineWidth=1; x.stroke(); }
    cles.forEach((k,i)=>{ const [X,Y]=pt(i,R); x.beginPath(); x.moveTo(cx,cy); x.lineTo(X,Y); x.strokeStyle="rgba(255,255,255,.12)"; x.stroke(); });
    x.beginPath(); cles.forEach((k,i)=>{ const [X,Y]=pt(i,R*e*(.1+.9*(traits[k]||0)/max)); i?x.lineTo(X,Y):x.moveTo(X,Y); }); x.closePath();
    x.fillStyle="rgba(111,232,255,.38)"; x.fill(); x.strokeStyle="#6fe8ff"; x.lineWidth=2; x.stroke();
    x.font='600 12px "Pixelify Sans", "Courier New", monospace'; x.textAlign="center"; x.textBaseline="middle";
    cles.forEach((k,i)=>{ const [X,Y]=pt(i,R+22); x.fillStyle=forts.includes(k)?"#ffe45c":"#ffffff"; x.fillText(TRAITS_NOMS[k], Math.max(46,Math.min(W-46,X)), Y); });
    if(g<1) requestAnimationFrame(trace);
  })(t0);
}

// Fond : la scène du portail, peinte une fois, puis animée par des lucioles et le souffle de la lueur.
(function fond(){
  const c=document.getElementById("bg"), x=c.getContext("2d"), W=c.width, H=c.height;
  scene(c,"portail","accueil");
  const base=x.getImageData(0,0,W,H), r=alea("lucioles"), L=[];
  for(let i=0;i<26;i++) L.push({x:r()*W, y:H*.5+r()*H*.48, p:r()*6.28, v:.2+r()*.5});
  if(matchMedia("(prefers-reduced-motion:reduce)").matches) return;
  const nuages=[]; for(let i=0;i<4;i++) nuages.push({x:r()*W, y:H*(.2+r()*.2), w:30+r()*40, v:.012+r()*.02});
  const cxA=W/2, cyA=H*.64, rA=H*.06;
  (function boucle(t){
    x.putImageData(base,0,0);
    // nuages lents dans le ciel
    nuages.forEach(n=>{ const X=Math.round((n.x+t*n.v)%(W+n.w)-n.w); x.fillStyle="rgba(200,200,255,.10)"; x.fillRect(X,Math.round(n.y),n.w,4); x.fillRect(X+5,Math.round(n.y)-3,n.w-14,3); });
    // étoile filante, de temps en temps
    const ph=(t%9000)/650; if(ph<1){ for(let i=0;i<7;i++){ x.fillStyle=`rgba(255,255,255,${(1-i/7)*(1-ph*.5)})`; x.fillRect(Math.round(W*.15+ph*W*.5-i*2), Math.round(H*.05+ph*H*.22-i), 1, 1); } }
    // souffle de la lueur et tourbillon dans l'arche
    const s=.5+.5*Math.sin(t/900); x.fillStyle=`rgba(200,250,255,${.10+.14*s})`; x.fillRect(Math.round(W/2-H*.075),Math.round(H*.48),Math.round(H*.15),Math.round(H*.33));
    for(let i=0;i<18;i++){ const a=t/520+i*.75, d=(i/18)*rA*(.8+.2*Math.sin(t/700+i)); x.fillStyle=i%3?"rgba(255,255,255,.9)":"#6fe8ff"; x.fillRect(Math.round(cxA+Math.cos(a)*d), Math.round(cyA+Math.sin(a)*d*2.1), 1, 1); }
    L.forEach(l=>{ const X=l.x+Math.sin(t/1400*l.v+l.p)*9, Y=l.y+Math.cos(t/1700*l.v+l.p)*6; if(Math.sin(t/500+l.p)>-.3){ x.fillStyle="rgba(255,240,150,.35)"; x.fillRect(Math.round(X)-1,Math.round(Y)-1,3,3); x.fillStyle="#fff6a0"; x.fillRect(Math.round(X),Math.round(Y),1,1); } });
    requestAnimationFrame(boucle);
  })(0);
})();

let sonActif=true, actx=null;
function bip(f=660,d=.04,type="square",vol=.03){
  if(!sonActif) return;
  try{ actx=actx||new (window.AudioContext||window.webkitAudioContext)(); const o=actx.createOscillator(), g=actx.createGain();
    o.type=type; o.frequency.value=f; g.gain.value=vol; o.connect(g); g.connect(actx.destination);
    o.start(); g.gain.exponentialRampToValueAtTime(.0001, actx.currentTime+d); o.stop(actx.currentTime+d+.02); }catch(e){}
}

// Balises de couleur dans les textes : {y}jaune{/}  {c}cyan{/}  {g}vert{/}
function segments(txt){ const out=[]; const re=/\{([ycg])\}(.*?)\{\/\}/gs; let i=0,m; while((m=re.exec(txt))){ if(m.index>i) out.push([txt.slice(i,m.index),""]); out.push([m[2],m[1]]); i=re.lastIndex; } if(i<txt.length) out.push([txt.slice(i),""]); return out; }
function ecrire(txt){
  return new Promise(res=>{
    elText.textContent=""; elMore.classList.remove("on");
    const segs=segments(txt); let si=0, ci=0, span=null, fini=false, n=0;
    const tout=()=>{ elText.textContent=""; segs.forEach(([t,k])=>{ const s=document.createElement("span"); if(k) s.className=k; s.textContent=t; elText.appendChild(s); }); fini=true; clearInterval(tm); res(); };
    const tm=setInterval(()=>{
      if(si>=segs.length){ fini=true; clearInterval(tm); avance=null; res(); return; }
      if(!span){ span=document.createElement("span"); if(segs[si][1]) span.className=segs[si][1]; elText.appendChild(span); }
      span.textContent+=segs[si][0][ci++]; if(++n%3===0) bip(520,.02,"square",.015);
      if(ci>=segs[si][0].length){ si++; ci=0; span=null; }
    }, 20);
    avance=()=>{ if(!fini){ avance=null; tout(); } };
  });
}

  CA:["calme","pose","zen","tranquil","patient","sage","serein","reflechi","stable"],
  JO:["drole","marrant","rigol","joyeu","fun","souriant","comique","blagu","clown","golri"],
  MA:["malin","maligne","ruse","fute","intelligen","sournois","taquin","strateg","filou","vicieu"],
  FI:["fier","fiere","ambitieu","perfectionn","exigean","competit","determin","tetu","orgueil","leader"],
  DO:["gentil","doux","douce","bienveillan","adorable","attention","genereu","sympa","sensible","empath"],
  RE:["timide","discret","reserve","solitaire","mysterieu","silencieu","introvert","secret"],
  GO:["gourmand","flemm","paresseu","feignan","dormeur","chill","glandeu","bon vivant","relax","detendu"],
  EN:["energi","hyperacti","dynami","sportif","sportive","speed","agite","pile","motive","actif","active"]
};
function lireMot(mot){ const m=String(mot).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,""); for(const t in LEXIQUE) if(LEXIQUE[t].some(d=>m.includes(d))) return t; return null; }
const PIPS = 13;   // 5 questions de premier contact + jusqu'à 5 d'approfondissement + 3 de clôture

// La consultation : tient les comptes et choisit la question suivante.
function consultation(graineId){
  const gagne={}, possible={}, posees=new Set(), cles=Object.keys(TRAITS_NOMS); let n=0, rapides=0;
  const C={ trace:"", desir:0,
    // Chaque trait est noté sur ce que les questions posées permettaient de gagner : personne n'est avantagé par le tirage.
    scores(){ const t={}; cles.forEach(k=>t[k]=possible[k]?(gagne[k]||0)/possible[k]:0); return t; },
    tete(){ const t=C.scores(); return cles.slice().sort((a,b)=>t[b]-t[a]); },
    // Phase 1 : cinq questions du premier cycle, celui qui balaie les neuf traits.
    troncCommun(){ return melange([0,1,2,3,4,5,6,7,8], graineId+"|"+Date.now()).slice(0,5); },
    // Phase 2 : on choisit la question qui oppose le plus de traits en tête, puis celle qui éclaire les traits encore peu vus.
    prochaine(){ const top=C.tete().slice(0,3); let mieux=[], max=-1;
      QUESTIONS.forEach((q,i)=>{ if(posees.has(i)) return; const duel=q[1].filter(a=>top.includes(a[1])).length, peuVus=q[1].reduce((s,a)=>s+1/(1+(possible[a[1]]||0)),0), note=duel*10+peuVus;
        if(note>max+1e-9){ max=note; mieux=[i]; } else if(Math.abs(note-max)<1e-9) mieux.push(i); });
      return mieux.length?mieux[Math.floor(Math.random()*mieux.length)]:-1; },
    // On s'arrête plus tôt quand le premier trait a nettement distancé le troisième.
    tranche(){ const t=C.scores(), o=C.tete(); return t[o[0]]-t[o[2]]>=.3; },
    async poser(i, phase){
      posees.add(i); panneau(pipsHTML(n,PIPS), false);
      const [q,reps]=QUESTIONS[i], ordre=melange(reps.map((_,j)=>j), graineId+i+Date.now());
      const k=await demander(`{c}${phase} · question ${n+1}{/}\n${q}`, ordre.map(j=>reps[j][0]));
      const poids=demander.duree<900?.5:1; if(poids<1) rapides++;      // une réponse donnée sans lire compte moitié
      const max={}; reps.forEach(([,a,b])=>{ max[a]=Math.max(max[a]||0,2); max[b]=Math.max(max[b]||0,1); });
      for(const t in max) possible[t]=(possible[t]||0)+max[t]*poids;
      const [,t1,t2]=reps[ordre[k]]; gagne[t1]=(gagne[t1]||0)+2*poids; gagne[t2]=(gagne[t2]||0)+poids; C.trace+=i+"-"+ordre[k]+"|"; n++;
    },
    get posees(){ return n; },
    bilan(mot){
      const t=C.scores(), moy=cles.reduce((s,k)=>s+t[k],0)/cles.length;
      if(C.desir>=2) cles.forEach(k=>t[k]=moy+(t[k]-moy)*.85);          // profil trop flatteur : on resserre les écarts
      mot=String(mot||"").replace(/[{}<>]/g,"").trim(); const lu=lireMot(mot); if(lu) t[lu]=Math.min(1,t[lu]+.12);
      cles.forEach(k=>t[k]=Math.round(t[k]*100)/100);
      const o=cles.slice().sort((a,b)=>t[b]-t[a]), [d1,d2]=o, faible=o[o.length-1], A=ARCHETYPES[d1];
      return { traits:t, d1, d2, faible, arche:A, titre:A.nom+" "+NUANCES[d2][0], portrait:A.portrait+" "+NUANCES[d2][1],
        fiabilite:Math.max(50,100-15*C.desir-5*Math.min(rapides,4)), questions:n, mot,
        motTxt:mot?(lu?`Tes amis disent « ${mot} ». Je le note : ça parle ${de(lu)}.`:`Tes amis disent « ${mot} ». Je le garde dans ton dossier : c'est un mot rien qu'à toi.`):"" };
    } };
  return C;
}
function symbole(cv, lignes){ const x=cv.getContext("2d"); x.clearRect(0,0,9,9); x.fillStyle="#ffffff"; lignes.forEach((l,Y)=>[...l].forEach((c,X)=>{ if(c==="#") x.fillRect(X,Y,1,1); })); }

const nomType=t=>(TYPES[t]||TYPES.normal)[0], coulType=t=>(TYPES[t]||TYPES.normal)[1];
const raretes=c=>RARETES.filter(([k])=>c&&c[k]);

const radarHTML=t=>`<canvas class="radar" width="250" height="210" data-radar="${esc(JSON.stringify(t))}"></canvas>`;
// « de la douceur » / « de l'énergie », et « de douceur » / « d'énergie »
const dela=k=>{ const n=TRAITS_NOMS[k].toLowerCase(); return /^[aeiouéè]/.test(n)?"de l'"+n:"de la "+n; };
const de=k=>{ const n=TRAITS_NOMS[k].toLowerCase(); return /^[aeiouéè]/.test(n)?"d'"+n:"de "+n; };
const dominants=t=>Object.keys(TRAITS_NOMS).sort((a,b)=>(t[b]||0)-(t[a]||0)).slice(0,2);
function profilHTML(t){ const [a,b]=dominants(t);

function bilanHTML(b){

    </div>${radarHTML(b.traits)}</div></div></div>`;
}
function defisHTML(p){
  return `<div class="tableau box"><h2>Tes défis de la saison</h2>${p.typeEquipe?`<div class="ligne"><span>Équipe monotype</span><b style="color:${coulType(p.typeEquipe)}">Type ${esc(p.typeEquipeNom||nomType(p.typeEquipe))}</b></div>`:""}
    <div class="defis">${(p.defis||[]).map(d=>`<div class="${d.fait?"fait":""}"><span>${d.fait?"✔":"▫"}</span>${esc(d.txt)}${d.trait?` <small class="c">· ${TRAITS_NOMS[d.trait]||""}</small>`:""}</div>`).join("")||"Aucun défi pour ce profil."}</div></div>`;
}
function carteDresseur(p){

    <div class="corps"><div class="deuxcol"><div>
        ${p.archetype?`<div class="ligne"><span>Archétype</span><b>${esc(p.archetype)}</b></div>`:""}
        <div class="ligne"><span>Nature</span><b>${esc(p.nature)}</b></div>
        <div class="ligne"><span>Starter</span><b style="color:${coulType(s.el)}">${esc(p.starter)}</b></div>

        <div class="ligne"><span>Minecraft</span><b>${p.mc?esc(p.mc)+(p.mcVerifie?" (vérifié)":" (déclaré)"):"non lié"}</b></div>
        <div class="defis">${(p.defis||[]).map(d=>`<div class="${d.fait?"fait":""}"><span>${d.fait?"✔":"▫"}</span>${esc(d.txt)}</div>`).join("")}</div>
      </div>${p.traits?radarHTML(p.traits):""}</div>
      <div class="minis">${raretes(p.cibles).map(([k,lab,col])=>`<div class="mini ${p.captures&&p.captures[k]?"ok":""} ${p.cibles[k].shiny?"shiny":""}"><canvas width="72" height="28" data-h="${p.cibles[k].habitat}" data-s="${esc(p.cibles[k].fr)}"></canvas><b>${esc(p.cibles[k].fr)}${p.cibles[k].shiny?" ✦":""}</b><i style="color:${col}">${p.captures&&p.captures[k]?"Capturé":lab}</i></div>`).join("")}</div>
    </div></div>`;

function tableauHTML(t){
  if(!t.joueurs.length) return `<div class="tableau box"><h2>Tableau de chasse</h2>Personne n'a encore passé le portail.</div>`;
  return `<div class="tableau box"><h2>Tableau de chasse <small class="c" style="font-size:15px">· ${esc(t.saison)}</small></h2>`+t.joueurs.map(j=>`<div class="rang"><div class="pj"><b>${esc(j.nom)}</b><small>${esc(j.starter)}${j.typeEquipe?" · équipe "+esc(j.typeEquipeNom||nomType(j.typeEquipe)):""}${j.mc?" · "+esc(j.mc):""}</small></div><div class="puces">`+
    raretes(j.cibles).map(([k,,col])=>`<span class="${j.captures[k]?"ok":""}"><i class="pastille" style="background:${j.captures[k]?"var(--green)":col}"></i>${esc(j.cibles[k].fr)}${j.cibles[k].shiny?" ✦":""}${j.captures[k]?" ✔":""}</span>`).join("")+`</div></div>`).join("")+`</div>`;
}
const pipsHTML=(n,N)=>`<div class="pips" aria-hidden="true">`+Array.from({length:N},(_,i)=>`<span class="${i<n?"fait":i===n?"ici":""}"></span>`).join("")+`</div>`;
function choisirALaMain(){
  return new Promise(res=>{
    let h=`<div class="grid box">`;
    REGIONS.forEach((reg,g)=>{ h+=`<div class="gen">${g+1} · ${reg}</div>`; STARTERS.filter(s=>s.gen===g).forEach(s=>{ h+=`<button class="cell" type="button" data-n="${esc(s.nom)}" style="--el:${TYPES[s.el][1]}">${esc(s.nom)}</button>`; }); });
    panneau(h+`</div>`);
    elPanel.querySelectorAll(".cell").forEach(b=>b.onclick=()=>{ bip(880,.06); res(STARTERS.find(s=>s.nom===b.dataset.n)); });
  });
}
// Le starter dont le profil de traits ressemble le plus aux réponses données.
function plusProche(liste, profilDe, traits, trace){
  const r=alea(trace); let mieux=[], max=-1;
  liste.forEach(s=>{ const pr=profilDe(s); let pts=0, norme=0; for(const t in pr){ pts+=(traits[t]||0)*pr[t]; norme+=pr[t]*pr[t]; } pts/=Math.sqrt(norme);
    if(pts>max+1e-9){ max=pts; mieux=[s]; } else if(Math.abs(pts-max)<1e-9) mieux.push(s); });
  return mieux[Math.floor(r()*mieux.length)];
}
const starterPour=(traits,trace)=>plusProche(STARTERS, s=>s.profil, traits, trace);

const calme=matchMedia("(prefers-reduced-motion:reduce)").matches;
function etincelles(el, couleur="#ffe45c", nb=14){
  if(calme||!el) return; const r=el.getBoundingClientRect(), cx=r.left+r.width/2, cy=r.top+r.height/2;
  for(let i=0;i<nb;i++){ const e=document.createElement("i"); e.className="etin"; const a=Math.random()*6.28, d=60+Math.random()*90;
    e.style.cssText=`left:${cx}px;top:${cy}px;background:${i%3?couleur:"#ffffff"};--dx:${Math.cos(a)*d}px;--dy:${Math.sin(a)*d}px`; document.body.appendChild(e); setTimeout(()=>e.remove(),800); }
}
function confettis(){
  if(calme) return; const cols=["#ffe45c","#6fe8ff","#8df07a","#ff9cc0","#ffffff","#f0703c"];
  for(let i=0;i<70;i++){ const e=document.createElement("i"); e.className="conf"; e.style.cssText=`left:${Math.random()*100}vw;background:${cols[i%cols.length]};animation-duration:${1.6+Math.random()*1.6}s;animation-delay:${Math.random()*.6}s;--dx:${(Math.random()-.5)*160}px`; document.body.appendChild(e); setTimeout(()=>e.remove(),4000); }
}
// Roulette : les noms défilent sur la carte, puis la vraie cible apparaît.
const LEURRES=["Roucool","Évoli","Pikachu","Riolu","Mew","Lugia","Goupix","Absol","Ronflex","Zorua","Togepi","Dialga","Tarsal","Axoloto","Motisma","Suicune","Griknot","Mimiqui"];
const ANNONCE={
  commun:n=>`Ta cible commune : {y}${n}{/}. Un bon début pour se faire la main.`,
  rare:n=>`Ta cible rare : {c}${n}{/}. Il faudra chercher un peu, ou faire évoluer.`,
  legend:n=>`Ta cible légendaire : {y}${n}{/}. Celle-là, c'est l'aventure d'une saison.`,
  shiny:n=>`Et pour finir, ton défi brillant : un {y}${n}{/} chromatique. Rare, mais quelle fierté le jour où il scintille.`
};
async function revelerCibles(c){
  panneau(cartesCibles(c,0)); await pause(350);
  for(let i=0;i<RARETES.length;i++){
    const [k,,col]=RARETES[i]; if(!c[k]) continue;
    const carte=elPanel.querySelectorAll(".card")[i], nm=carte.querySelector(".nm");
    carte.scrollIntoView({block:"nearest",inline:"nearest"}); carte.classList.add("tourne");
    if(!calme) for(let t=0;t<13;t++){ nm.textContent=LEURRES[Math.floor(Math.random()*LEURRES.length)]; bip(320+t*45,.03,"square",.02); await pause(50+t*7); }
    const tmp=document.createElement("div"); tmp.innerHTML=carteCible(c[k],i,true,true); const vraie=tmp.firstElementChild;
    carte.replaceWith(vraie); peindre(vraie); etincelles(vraie, getComputedStyle(document.documentElement).getPropertyValue(col.slice(4,-1))||"#ffe45c");
    if(i>=RARETES.length-2) fanfare(); else bip(620+i*90,.12);
    await dire(ANNONCE[k](c[k].fr));
  }
}

async function lierMinecraft(){
  const pseudo=await saisir("Quel est ton pseudo Minecraft exact ?", 16);
  try{
    const r=await BOT.lier(pseudo);
    if(r.mode==="code"){
      await dire("Un code à quatre chiffres vient de s'afficher dans ton chat Minecraft.");
      const code=await saisir("Tape ce code ici.", 4);
      await BOT.confirmer(code);
      await dire(`C'est vérifié. Ton compte Minecraft {y}${pseudo}{/} est lié à ton compte Discord.`);
    } else await dire(`C'est noté : {y}${pseudo}{/}. Le lien sera vérifié en jeu quand le serveur sera relié au Portail.`);
  }catch(e){ await dire("{y}Ça n'a pas marché.{/} "+e.message); }
}
async function accueilConnu(){
  for(;;){
    const etat=await BOT.moi(), p=etat.profil;
    panneau(carteDresseur(p));
    const k=await demander(`Te revoilà, {y}${p.nom}{/}. Que veux-tu faire ?`, ["Revoir mes cibles","Voir mes défis","Voir le tableau de chasse", p.mc?"Changer de compte Minecraft":"Lier mon compte Minecraft"]);
    if(k===0){ panneau(cartesCibles(p.cibles,RARETES.length)); await dire("Tes cibles de la saison. Une cible évoluée peut s'obtenir en faisant évoluer sa forme de base."); }
    if(k===1){ panneau(defisHTML(p)); await dire(p.typeEquipe?`Ton caractère t'a donné le type {y}${p.typeEquipeNom||nomType(p.typeEquipe)}{/}, et des défis à ta mesure.`:"Ton profil date d'avant les défis : tu en recevras à la prochaine saison."); }
    if(k===2){ panneau(tableauHTML(await BOT.tableau())); await dire("Voici les cibles de tout le monde. Une cible cochée a été capturée."); }
    if(k===3) await lierMinecraft();
  }
}

async function demarrer(){
  $("srv").textContent=CONFIG.NOM_SERVEUR;
  panneau(`<div class="title"><h1>LE PORTAIL</h1><p>${esc(CONFIG.NOM_SERVEUR)}</p></div>`, false);
  const j=jeton();
  await dire("Salut, voyageur. Tu es devant le portail du serveur.");
  if(!DEMO && !j){
    await demander("Pour que je te reconnaisse, montre-moi ton compte Discord. Je ne lis que ton nom et ton avatar.", ["Se connecter avec Discord"]);
    await ecrire("Je t'emmène chez Discord…"); connexionDiscord(); return;
  }
  let etat;
  try{ etat=await BOT.moi(); }
  catch(e){ await demander("{y}Je n'arrive pas à te reconnaître.{/} "+e.message, [e.reconnexion?"Me reconnecter":"Réessayer"]); if(e.reconnexion) connexionDiscord(); else location.reload(); return; }
  const moi=etat.utilisateur;
  $("qui").style.display="flex"; $("qui").innerHTML=(moi.avatar?`<img src="${esc(moi.avatar)}" alt="">`:"")+esc(moi.nom);
  if(etat.profil) return accueilConnu();

  // --- La consultation : trois phases, pilotées par les réponses
  await dire(`Enchanté, {y}${moi.nom}{/}. Je suis le psychiatre du Portail, et tu es mon patient du jour.`);
  await dire("Pas de bonne réponse ici : je ne cherche pas ce que tu sais, je cherche qui tu es. Je commence large, puis je creuserai là où tu m'intrigues.");
  const C=consultation(moi.id);
  for(const i of C.troncCommun()) await C.poser(i,"Premier contact");
  const [p1,p2]=C.tete();
  await dire(`Hmm. Je vois déjà deux pistes chez toi : {y}${TRAITS_NOMS[p1].toLowerCase()}{/} et {c}${TRAITS_NOMS[p2].toLowerCase()}{/}. Creusons.`);
  for(let n=0;n<5;n++){
    const i=C.prochaine(); if(i<0) break;
    const avant=C.tete()[0]; await C.poser(i,"Approfondissement"); const apres=C.tete()[0];
    if(n>=2 && C.tranche()) break;
    if(apres!==avant && n<4) await dire(`Tiens, ça bouge : ${TRAITS_NOMS[apres].toLowerCase()} passe en tête. Continuons.`);
  }
  await dire("J'y vois plus clair. Encore deux questions de franchise, puis une dernière, sans filet.");
  for(let i=0;i<SINCERITE.length;i++){ panneau(pipsHTML(PIPS-3+i,PIPS), false); if(await demander(`{c}Franchise{/}\n${SINCERITE[i][0]}`, SINCERITE[i][1])===0) C.desir++; }
  panneau(pipsHTML(PIPS-1,PIPS), false);
  const mot=await saisir("Sans proposition cette fois. En un mot : comment tes amis te décriraient-ils ?", 20);
  const bilan=C.bilan(mot), traits=bilan.traits, trace=C.trace;
  await dire("Merci. Laisse-moi relire mes notes…");
  panneau(bilanHTML(bilan)); fanfare(); etincelles(elPanel.querySelector(".bilan .tete"), bilan.arche.c2);
  await dire(`Mon diagnostic : tu es {y}${bilan.titre}{/}.`);
  await dire(bilan.portrait);
  if(bilan.motTxt) await dire(bilan.motTxt);
  await dire(`Ton angle mort : ${TRAITS_NOMS[bilan.faible].toLowerCase()}, c'est le trait que tu montres le moins. Fiabilité de tes réponses : {c}${bilan.fiabilite} %{/}.`);
  let s=starterPour(traits, trace), accepte=true;
  await dire(`Reste à te trouver un compagnon. Il te faut quelqu'un de nature… {y}${s.nature}{/} !`);
  await dire(s.txt);
  fanfare(); panneau(carteStarter(s)); etincelles(elPanel.querySelector(".card"), coulType(s.el));
  if(await demander(`Le compagnon qui te ressemble, c'est {y}${s.nom}{/}. Tu pars avec lui ?`, ["Oui, on y va ensemble !","Non, je préfère choisir moi-même."])===1){
    accepte=false;
    const p=ecrire("Très bien. Choisis ton compagnon parmi les neuf régions.");
    s=await choisirALaMain(); await p;
    panneau(carteStarter(s)); fanfare(); etincelles(elPanel.querySelector(".card"), coulType(s.el));
    await dire(`{y}${s.nom}{/}, de nature {c}${s.nature}{/}. ${s.txt}`);
  }

  // --- Tirage des cibles par le bot
  await dire("Passons à la chasse. Chaque voyageur reçoit trois cibles tirées au sort, de la commune à la légendaire, plus un Pokémon à capturer en version chromatique.");
  await demander("Prêt à tirer tes cibles ? Le tirage est définitif pour toute la saison.", ["Tirer mes cibles"]);
  await ecrire("Les dés roulent…");
  let profil;
  for(;;){
    try{ profil=(await BOT.tirage({nature:s.nature, element:s.el, starter:s.nom, accepte, traits, archetype:bilan.titre})).profil; break; }
    catch(e){ await demander("{y}Le tirage n'est pas passé.{/} "+e.message, ["Réessayer"]); if(e.reconnexion){ connexionDiscord(); return; } await ecrire("Les dés roulent…"); }
  }
  await revelerCibles(profil.cibles);

  // --- Défis liés à la personnalité
  if(profil.typeEquipe){
    panneau(defisHTML(profil));
    await dire(`Dernier point de mon ordonnance. Ton caractère appelle un type : {y}${profil.typeEquipeNom}{/}. Ton grand défi sera de monter une équipe de six Pokémon de ce type.`);
    const perso=(profil.defis||[]).filter(d=>d.trait);
    if(perso.length) await dire(`Et parce que tu es fait ${de(perso[0].trait)}${perso[1]?" et "+de(perso[1].trait):""}, deux défis rien que pour toi t'attendent.`);
  }
  await dire(DEMO?"En mode démonstration, rien n'est envoyé sur Discord.":"Tout le monde vient d'être prévenu sur Discord.");
  panneau(carteDresseur(profil)); fanfare(); confettis();
  await dire(`Le portail est ouvert. En jeu, choisis bien {y}${profil.starter}{/} comme starter.`);
  if(!etat.lien.mc && await demander("Veux-tu lier ton compte Minecraft maintenant ? C'est ce qui permettra d'afficher tes cibles en jeu.", ["Oui, je le lie","Plus tard"])===0) await lierMinecraft();
  return accueilConnu();
}
demarrer();
</script>
